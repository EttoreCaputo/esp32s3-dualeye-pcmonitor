[package]
name = "dualeye-app"
version = "0.1.0"
edition = "2024"
description = "Desktop app for the ESP32-S3 DualEye PC monitor"

[lib]
name = "dualeye_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dualeye-app"
path = "src/main.rs"

[dependencies]
dualeye-core = { version = "0.1.0", path = "../../dualeye-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.6", features = ["tray-icon"] }

[build-dependencies]
tauri-build = "2.6.3"
